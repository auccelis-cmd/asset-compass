<!doctype html>
<html lang="zh-Hant" class="sky">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111B20">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="資產羅盤">
  <title>資產羅盤</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600;6..96,700&family=Cormorant+Garamond:wght@500;600;700&family=Noto+Serif+TC:wght@500;600;700;900&family=Pinyon+Script&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="preload" href="yuji-ledger.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css?v=2026.10.10p">
  <script>try{var t=localStorage.getItem("ac_star_v1")?(localStorage.getItem("ac_theme")||"starmap"):"starmap";t={champagne:"ivory",mist:"ivory",oat:"ivory",forest:"green"}[t]||t;document.documentElement.dataset.theme=t}catch(e){document.documentElement.dataset.theme="starmap"}</script>
</head>
<body>
  <div id="auth" class="auth" hidden>
    <div class="auth-card">
      <div class="brand big"><svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M12 3.5 14 12l-2 8.5L10 12Z" class="fill"/></svg>資產羅盤</div>
      <p class="muted">登入後，手機與電腦會同步同一份資料。</p>
      <form id="authForm">
        <label>Email<input type="email" name="email" autocomplete="email" required></label>
        <label>密碼<input type="password" name="password" autocomplete="current-password" minlength="6" required></label>
        <button class="btn primary" type="submit">登入</button>
        <button class="btn ghost" type="button" id="signupBtn">第一次使用：註冊帳號</button>
      </form>
      <p class="err" id="authErr"></p>
    </div>
  </div>

  <div id="app" hidden>
    <header class="top">
      <div class="brand"><svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M12 3.5 14 12l-2 8.5L10 12Z" class="fill"/></svg><span class="bt">資產羅盤<small>ASSET COMPASS</small></span></div>
      <div class="top-actions">
        <button class="icon-btn" data-act="toggle-hide" aria-label="隱藏金額"></button>
        <button class="icon-btn" data-act="refresh" aria-label="更新報價"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg></button>
        <button class="icon-btn" data-act="goto" data-tab="settings" aria-label="設定"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg></button>
      </div>
    </header>
    <main id="view"></main>
    <nav class="tabs" aria-label="主要分頁">
      <button data-tab="overview"><svg viewBox="0 0 24 24"><path d="M4 11 12 4l8 7M6 9.5V20h12V9.5"/></svg>總覽</button>
      <button data-tab="bank"><svg viewBox="0 0 24 24"><path d="M3 9.5 12 4l9 5.5M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 20.5h18"/></svg>帳戶</button>
      <button class="fab" data-act="fab" aria-label="快速記帳"><svg viewBox="0 0 24 24"><path d="M12 2.5 14 10l7.5 2L14 14l-2 7.5L10 14l-7.5-2L10 10Z"/></svg></button>
      <button data-tab="cards"><svg viewBox="0 0 24 24"><rect x="2.5" y="5.5" width="19" height="13" rx="2.5"/><path d="M2.5 10h19M6 15h4"/></svg>信用卡</button>
      <button data-tab="invest"><svg viewBox="0 0 24 24"><path d="M3 19.5h18M4 16l5-5 4 3 7-8M15 6h5v5"/></svg>投資</button>
    </nav>
  </div>

  <div id="modal" class="modal" hidden></div>
  <div id="toast" class="toast" hidden></div>

  <script src="config.js?v=2026.10.10p"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="app.js?v=2026.10.10p"></script>
</body>
</html>
