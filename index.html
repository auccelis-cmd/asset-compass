<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F6EFEC">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="月汐">
  <title>月汐 Lunaria</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=1.3.0">
  <script>try{var c=JSON.parse(localStorage.getItem("lun_set")||"{}"),m=c.mode||"auto";if(m==="auto")m=matchMedia("(prefers-color-scheme: dark)").matches?"night":"day";document.documentElement.dataset.pal=c.pal||"moss";document.documentElement.dataset.mode=m}catch(e){document.documentElement.dataset.pal="moss";document.documentElement.dataset.mode="day"}</script>
</head>
<body>
  <div id="auth" class="auth" hidden>
    <div class="auth-card">
      <div class="logo big"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M21 4a12 12 0 1 0 7 21A10 10 0 0 1 21 4Z"/></svg><span>月汐<small>LUNARIA</small></span></div>
      <p class="muted">登入後，妳的紀錄會加密傳輸並同步到妳的雲端資料庫。</p>
      <form id="authForm">
        <label>Email<input type="email" name="email" autocomplete="email" required></label>
        <label>密碼<input type="password" name="password" autocomplete="current-password" minlength="6" required></label>
        <button class="btn primary" type="submit">登入</button>
        <button class="btn ghost" type="button" id="signupBtn">第一次使用：註冊帳號</button>
      </form>
      <p class="err" id="authErr"></p>
    </div>
  </div>

  <div id="app" hidden>
    <header class="top">
      <div class="logo"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M21 4a12 12 0 1 0 7 21A10 10 0 0 1 21 4Z"/></svg><span>月汐<small>LUNARIA</small></span></div>
      <div class="top-r"><span class="role-pill" id="rolePill" hidden></span><button class="icon-btn" data-act="hide" aria-label="隱私遮罩" id="hideBtn"></button><button class="icon-btn" data-act="tab" data-tab="remind" aria-label="提醒" id="bellBtn"></button></div>
    </header>
    <main id="view"></main>
    <nav class="nav" id="nav" aria-label="主要分頁"></nav>
  </div>
  <div id="sheet" class="sheet-wrap" hidden></div>
  <div id="toast" class="toast" role="status" hidden></div>

  <script src="config.js?v=1.3.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="cycle.js?v=1.3.0"></script>
  <script src="app.js?v=1.3.0"></script>
</body>
</html>
